global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'stateflow-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Worker metrics - celery worker doesn't expose HTTP /metrics endpoint by default
  # Enable this if you add prometheus client to celery worker with a metrics port
  # - job_name: 'stateflow-worker'
  #   static_configs:
  #     - targets: ['worker:9091']
  #   metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis metrics - requires redis-exporter sidecar (not included in this compose)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # RabbitMQ metrics - requires rabbitmq-prometheus plugin
  # - job_name: 'rabbitmq'
  #   static_configs:
  #     - targets: ['rabbitmq:15692']
